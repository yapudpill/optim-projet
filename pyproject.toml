[project]
name = "optim-projet"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
]
